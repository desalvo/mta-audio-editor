apiVersion: apps/v1
kind: Deployment
metadata:
  name: mta-audio-editor
  namespace: mta-audio-editor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mta-audio-editor
  template:
    metadata:
      labels:
        app: mta-audio-editor
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      # nodeSelector:
      #   kubernetes.io/hostname: worker-01
      containers:
        - name: mta-audio-editor
          image: desalvo/mta-audio-editor:0.2.0-113
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MTA_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mta-audio-editor-auth
                  key: username
            - name: MTA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mta-audio-editor-auth
                  key: password
            - name: MTA_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mta-audio-editor-auth
                  key: email
                  optional: true
            - name: MTA_MAX_UPLOAD_MB
              value: "1024"
            - name: MTA_DEMUCS_MODEL_AUTO_UPDATE
              value: "true"
            - name: MTA_DEMUCS_MODEL_UPDATE_INTERVAL_SECONDS
              value: "21600"
            - name: MTA_DEMUCS_MODEL_MANIFEST_URL
              value: "https://github.com/desalvo/mta-audio-editor/releases/download/demucs-models/manifest.json"
            - name: MTA_DEMUCS_MOBILE_MODEL_DIR
              value: "/data/projects/.models"
            # Social login is disabled by default. Set the matching *_ENABLED to "true"
            # and populate client credentials in mta-audio-editor-auth.
            - name: MTA_OAUTH_GOOGLE_ENABLED
              value: "false"
            - name: MTA_OAUTH_GOOGLE_CLIENT_ID
              valueFrom: {secretKeyRef: {name: mta-audio-editor-auth, key: oauth-google-client-id, optional: true}}
            - name: MTA_OAUTH_GOOGLE_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: mta-audio-editor-auth, key: oauth-google-client-secret, optional: true}}
            - name: MTA_OAUTH_FACEBOOK_ENABLED
              value: "false"
            - name: MTA_OAUTH_FACEBOOK_CLIENT_ID
              valueFrom: {secretKeyRef: {name: mta-audio-editor-auth, key: oauth-facebook-client-id, optional: true}}
            - name: MTA_OAUTH_FACEBOOK_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: mta-audio-editor-auth, key: oauth-facebook-client-secret, optional: true}}
            - name: MTA_OAUTH_GITHUB_ENABLED
              value: "false"
            - name: MTA_OAUTH_GITHUB_CLIENT_ID
              valueFrom: {secretKeyRef: {name: mta-audio-editor-auth, key: oauth-github-client-id, optional: true}}
            - name: MTA_OAUTH_GITHUB_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: mta-audio-editor-auth, key: oauth-github-client-secret, optional: true}}
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data/projects
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mta-audio-editor-data
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
