apiVersion: apps/v1
kind: Deployment
metadata:
  name: mta-audio-editor
  namespace: mta-audio-editor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mta-audio-editor
  template:
    metadata:
      labels:
        app: mta-audio-editor
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # nodeSelector:
      #   kubernetes.io/hostname: worker-01
      containers:
        - name: mta-audio-editor
          image: desalvo/mta-audio-editor:0.2.0-13
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MTA_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mta-audio-editor-auth
                  key: username
            - name: MTA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mta-audio-editor-auth
                  key: password
            - name: MTA_MAX_UPLOAD_MB
              value: "512"
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data/projects
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mta-audio-editor-data
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
