apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mta-ace-checkpoints
  namespace: mta-audio-editor
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mta-ace-cache
  namespace: mta-audio-editor
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 30Gi
