apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mta-audio-editor
  namespace: mta-audio-editor
  annotations:
    haproxy-ingress.github.io/proxy-body-size: "150m"
spec:
  ingressClassName: haproxy
  rules:
    - host: mta-audio-editor.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mta-audio-editor
                port:
                  number: 80
