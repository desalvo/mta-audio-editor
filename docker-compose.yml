services:
  mta-audio-editor:
    build:
      context: .
      args:
        APP_VERSION: "0.2.0-58"
        BUILD_ID: "${BUILD_ID:-local}"
    image: desalvo/mta-audio-editor:0.2.0-58
    ports:
      - "8080:8080"
    environment:
      MTA_ADMIN_USERNAME: "${MTA_ADMIN_USERNAME:-admin}"
      MTA_ADMIN_PASSWORD: "${MTA_ADMIN_PASSWORD:?set MTA_ADMIN_PASSWORD}"
      MTA_ADMIN_EMAIL: "${MTA_ADMIN_EMAIL:?set MTA_ADMIN_EMAIL}"
      MTA_MAX_UPLOAD_MB: "${MTA_MAX_UPLOAD_MB:-150}"
    volumes:
      - mta-data:/data/projects
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped
volumes:
  mta-data:
