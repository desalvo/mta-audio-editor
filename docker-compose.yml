services:
  mta-audio-editor:
    build:
      context: .
      args:
        APP_VERSION: "0.3.0"
        APP_REVISION: "196"
        BUILD_ID: "${BUILD_ID:-local}"
    image: desalvo/mta-audio-editor:0.3.0-r196
    ports:
      - "8080:8080"
    environment:
      MTA_AI_WORKER_ENABLED: "true"
      MTA_AI_WORKER_EXECUTABLE: /app/app/ace_step_http_worker.py
      MTA_ACE_STEP_URL: http://ace-step:8001
      MTA_ACE_STEP_TRUSTED_HOST: ace-step
      MTA_ACE_MODEL_CACHE: /models/checkpoints
      HF_HOME: /models/huggingface
      MTA_ADMIN_USERNAME: "${MTA_ADMIN_USERNAME:-admin}"
      MTA_ADMIN_PASSWORD: "${MTA_ADMIN_PASSWORD:?set MTA_ADMIN_PASSWORD}"
      MTA_ADMIN_EMAIL: "${MTA_ADMIN_EMAIL:?set MTA_ADMIN_EMAIL}"
      MTA_MAX_UPLOAD_MB: "${MTA_MAX_UPLOAD_MB:-1024}"
      MTA_DEMUCS_MODEL_AUTO_UPDATE: "${MTA_DEMUCS_MODEL_AUTO_UPDATE:-true}"
      MTA_DEMUCS_MODEL_UPDATE_INTERVAL_SECONDS: "${MTA_DEMUCS_MODEL_UPDATE_INTERVAL_SECONDS:-21600}"
      MTA_DEMUCS_MODEL_MANIFEST_URL: "${MTA_DEMUCS_MODEL_MANIFEST_URL:-https://github.com/desalvo/mta-audio-editor/releases/download/demucs-models/manifest.json}"
      MTA_DEMUCS_MOBILE_MODEL_DIR: /data/projects/.models
      MTA_PUBLIC_URL: "${MTA_PUBLIC_URL:-}"
      MTA_OAUTH_GOOGLE_ENABLED: "${MTA_OAUTH_GOOGLE_ENABLED:-false}"
      MTA_OAUTH_GOOGLE_CLIENT_ID: "${MTA_OAUTH_GOOGLE_CLIENT_ID:-}"
      MTA_OAUTH_GOOGLE_CLIENT_SECRET: "${MTA_OAUTH_GOOGLE_CLIENT_SECRET:-}"
      MTA_OAUTH_FACEBOOK_ENABLED: "${MTA_OAUTH_FACEBOOK_ENABLED:-false}"
      MTA_OAUTH_FACEBOOK_CLIENT_ID: "${MTA_OAUTH_FACEBOOK_CLIENT_ID:-}"
      MTA_OAUTH_FACEBOOK_CLIENT_SECRET: "${MTA_OAUTH_FACEBOOK_CLIENT_SECRET:-}"
      MTA_OAUTH_GITHUB_ENABLED: "${MTA_OAUTH_GITHUB_ENABLED:-false}"
      MTA_OAUTH_GITHUB_CLIENT_ID: "${MTA_OAUTH_GITHUB_CLIENT_ID:-}"
      MTA_OAUTH_GITHUB_CLIENT_SECRET: "${MTA_OAUTH_GITHUB_CLIENT_SECRET:-}"
    volumes:
      - mta-data:/data/projects
      - ace-checkpoints:/models/checkpoints:ro
      - ace-hf-cache:/models/huggingface:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [mta-internal, mta-public]
  ace-step:
    image: ${MTA_ACE_STEP_IMAGE:?Set MTA_ACE_STEP_IMAGE to the immutable GHCR tag produced by ace-step-runtime.yml}
    environment:
      ACESTEP_MODE: api
      ACESTEP_INIT_SERVICE: "true"
      ACESTEP_LLM_BACKEND: pt
      ACESTEP_CONFIG_PATH: acestep-v15-turbo
      ACESTEP_LM_MODEL_PATH: acestep-5Hz-lm-1.7B
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ace-checkpoints:/app/checkpoints
      - ace-hf-cache:/root/.cache/huggingface
      - ace-output:/app/output
    shm_size: 2gb
    networks: [mta-internal]
    restart: unless-stopped
    # GPU support requires a compatible GPU runtime; see ACE_STEP_DEPLOYMENT.md
volumes:
  mta-data:
  ace-checkpoints:
  ace-hf-cache:
  ace-output:
networks:
  mta-internal:
  mta-public:

