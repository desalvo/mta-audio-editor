[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
omit = ["app/__init__.py"]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["F", "S"]
ignore = ["S104", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
