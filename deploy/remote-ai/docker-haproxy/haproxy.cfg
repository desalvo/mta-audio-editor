global
  log stdout format raw local0
  maxconn 1024

defaults
  mode http
  log global
  option httplog
  option http-server-close
  timeout connect 10s
  timeout client  1200s
  timeout server  1200s

frontend https
  bind :443 ssl crt /usr/local/etc/haproxy/certs/mta.pem
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-Port 443
  http-request set-header X-Forwarded-For %[src]
  acl valid_host hdr(host),lower -i mta.example.org
  http-request deny deny_status 421 unless valid_host
  default_backend mta

backend mta
  # Replace this with the PRIVATE address of the VM/LXC running MTA, NOT ACE-Step.
  server mta01 192.0.2.50:8080 check
