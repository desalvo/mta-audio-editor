services:
  haproxy:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    ports:
      - '443:443'
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/usr/local/etc/haproxy/certs:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
