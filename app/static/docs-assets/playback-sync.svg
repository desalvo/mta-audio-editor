<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><style>.t{fill:#fff;font:700 22px Arial}.s{fill:#cce5ff;font:16px Arial}.b{fill:#102a44;stroke:#4595d8;stroke-width:2}.g{fill:#123b32;stroke:#56c790;stroke-width:2}.a{stroke:#77bbf2;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77bbf2"/></marker></defs><rect width="1200" height="480" rx="24" fill="#081522"/><text class="t" x="600" y="52" text-anchor="middle">Dynamic playback synchronization</text><rect class="b" x="55" y="120" width="220" height="110" rx="16"/><text class="t" x="165" y="160" text-anchor="middle">1. Buffer</text><text class="s" x="165" y="192" text-anchor="middle">wait for every track</text><rect class="b" x="350" y="120" width="220" height="110" rx="16"/><text class="t" x="460" y="160" text-anchor="middle">2. Align</text><text class="s" x="460" y="192" text-anchor="middle">same transport time</text><rect class="g" x="645" y="120" width="220" height="110" rx="16"/><text class="t" x="755" y="160" text-anchor="middle">3. Start</text><text class="s" x="755" y="192" text-anchor="middle">one reference clock</text><rect class="b" x="940" y="120" width="205" height="110" rx="16"/><text class="t" x="1042" y="160" text-anchor="middle">4. Correct drift</text><text class="s" x="1042" y="192" text-anchor="middle">continuous re-alignment</text><path class="a" d="M275 175 H340"/><path class="a" d="M570 175 H635"/><path class="a" d="M865 175 H930"/><text class="s" x="600" y="330" text-anchor="middle">Seek, Resume and |◀ re-arm all active sources at the same position.</text><text class="s" x="600" y="365" text-anchor="middle">Render mode uses the rendered master as transport clock while track meters run on a silent monitor branch.</text></svg>