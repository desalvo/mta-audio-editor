<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><style>.t{fill:#fff;font:700 22px Arial}.s{fill:#d0e7ff;font:16px Arial}.b{fill:#102a44;stroke:#4898dd;stroke-width:2}.a{stroke:#78bef3;stroke-width:4;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78bef3"/></marker></defs><rect width="1200" height="440" rx="24" fill="#081522"/><rect class="b" x="80" y="115" width="260" height="190" rx="24"/><text class="t" x="210" y="160" text-anchor="middle">Android / iOS</text><text class="s" x="210" y="200" text-anchor="middle">first launch</text><text class="s" x="210" y="235" text-anchor="middle">uses built-in service</text><text class="s" x="210" y="270" text-anchor="middle">no URL prompt</text><rect class="b" x="470" y="115" width="260" height="190" rx="24"/><text class="t" x="600" y="160" text-anchor="middle">MTA server</text><text class="s" x="600" y="200" text-anchor="middle">projects, rendering</text><text class="s" x="600" y="235" text-anchor="middle">waveforms, stems</text><text class="s" x="600" y="270" text-anchor="middle">authenticated session</text><rect class="b" x="860" y="115" width="260" height="190" rx="24"/><text class="t" x="990" y="160" text-anchor="middle">Server settings</text><text class="s" x="990" y="200" text-anchor="middle">optional custom URL</text><text class="s" x="990" y="235" text-anchor="middle">custom value may be shown</text><text class="s" x="990" y="270" text-anchor="middle">restore default silently</text><path class="a" d="M340 210 H455"/><path class="a" d="M860 210 H745"/></svg>