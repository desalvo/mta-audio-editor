<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>.t{fill:#fff;font:700 22px Arial}.s{fill:#d6eaff;font:16px Arial}.b{fill:#112c47;stroke:#4e9add;stroke-width:2}.c{fill:#3d2b16;stroke:#d89a45;stroke-width:2}.m{fill:#2a2342;stroke:#9e7ce3;stroke-width:2}</style><rect width="1200" height="520" rx="24" fill="#081522"/><text class="t" x="600" y="48" text-anchor="middle">MTA file organization</text><rect class="b" x="65" y="100" width="1070" height="70" rx="14"/><text class="t" x="600" y="143" text-anchor="middle">EBML / Segment / SeekHead / Info / Tracks / Attachments / Cues</text><rect class="c" x="65" y="210" width="1070" height="95" rx="14"/><text class="t" x="600" y="248" text-anchor="middle">Media region from first Cluster to EOF</text><text class="s" x="600" y="280" text-anchor="middle">fixed 984-byte periodic XOR transport over canonical Matroska media bytes</text><rect class="m" x="65" y="350" width="510" height="105" rx="14"/><text class="t" x="320" y="390" text-anchor="middle">Audio streams</text><text class="s" x="320" y="425" text-anchor="middle">MP3 44.1 kHz stereo, frame-major blocks</text><rect class="m" x="625" y="350" width="510" height="105" rx="14"/><text class="t" x="880" y="390" text-anchor="middle">Metadata / attachments</text><text class="s" x="880" y="425" text-anchor="middle">MtxInfoData, lyrics, chords, colors, MIDITK</text></svg>