<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280"><style>text{font-family:Arial,sans-serif;fill:#1f2937}.t{font-size:20px;font-weight:700}.s{font-size:15px}.b{fill:#eef5ff;stroke:#3778c2;stroke-width:2}.g{fill:#eefaf1;stroke:#3b8b55;stroke-width:2}.a{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect class="b" x="25" y="80" width="190" height="110" rx="14"/><text class="t" x="55" y="120">1. Importa</text><text class="s" x="55" y="150">MTA o nuove tracce</text><rect class="b" x="300" y="80" width="190" height="110" rx="14"/><text class="t" x="328" y="120">2. Sincronizza</text><text class="s" x="328" y="150">manuale / automatica</text><rect class="b" x="575" y="80" width="190" height="110" rx="14"/><text class="t" x="610" y="120">3. Modifica</text><text class="s" x="610" y="150">clip, tagli, ripple</text><rect class="g" x="850" y="80" width="220" height="110" rx="14"/><text class="t" x="890" y="120">4. Esporta</text><text class="s" x="890" y="150">render + MTA8/MTA16</text><path class="a" d="M215 135h80"/><path class="a" d="M490 135h80"/><path class="a" d="M765 135h80"/><text class="s" x="35" y="235">Editing non distruttivo: le sorgenti restano intatte fino al rendering finale.</text></svg>
