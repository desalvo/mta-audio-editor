<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTA Audio Editor</title>
  <link rel="icon" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="__BODY_CLASS__">
<div class="app-shell">
  <header class="topbar">
    <a class="app-github-mark" href="https://github.com/desalvo/mta-audio-editor" target="_blank" rel="noopener noreferrer" title="MTA Audio Editor on GitHub" aria-label="MTA Audio Editor on GitHub"><img src="/static/mta-audio-editor-mark.svg" alt=""></a>
    <div class="transport-stack"><div class="transport">
      <button class="transport-btn" onclick="stopPlayback()" title="Stop" aria-label="Stop">■</button><button class="transport-btn" onclick="goTransportStart()" title="Torna all'inizio" aria-label="Torna all'inizio">|◀</button><button class="transport-btn" onclick="seekTransport(-5000)" title="Riavvolgi 5 secondi" aria-label="Riavvolgi 5 secondi">◀◀</button><button id="playMaster" class="transport-btn play" onclick="togglePlayback()" title="Play / Preview" aria-label="Play / Preview">▶</button><button class="transport-btn" onclick="seekTransport(5000)" title="Avanti 5 secondi" aria-label="Avanti 5 secondi">▶▶</button><button id="renderBtn" class="transport-btn render-mode" onclick="toggleRenderPreview()" title="Render: include filtri e master nella preview" aria-label="Render preview">Render</button><button id="followBtn" class="transport-btn follow-mode" onclick="toggleFollowPlayback()" title="Follow: mantieni il playhead visibile" aria-label="Follow playback">Follow</button><button id="showLyricsBtn" class="transport-btn timed-display-mode" aria-label="Show Lyrics durante il play" onclick="togglePlaybackLyrics()" title="Show Lyrics durante il play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg></button><button id="showMarkersBtn" class="transport-btn timed-display-mode" onclick="togglePlaybackMarkers()" title="Show Markers" aria-label="Show Markers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22V2m0 2h14l-4 5 4 5H5"/></svg></button><button id="showChordsBtn" class="transport-btn timed-display-mode" aria-label="Show Chords durante il play" onclick="togglePlaybackChords()" title="Show Chords durante il play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 18V4l12-2v14M8 7l12-2"/><ellipse cx="5" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></svg></button>
    </div><span id="headerProjectName" class="transport-project-name" title="Current project" aria-live="polite">No project loaded</span></div>
    <div class="timebox"><input id="transportTime" class="transport-time-input" type="text" value="00:00.000" inputmode="decimal" aria-label="Posizione transport" title="Digita m:ss.mmm oppure misura:beat e premi Invio" onchange="setTransportTime(this.value)" onkeydown="transportTimeKeydown(event)"><select id="transportDisplayMode" class="transport-display-mode" onchange="setTransportDisplayMode(this.value)" title="Formato posizione transport"><option value="time">mm:ss.ms</option><option value="musical">Misure:Beat</option></select><span><input id="transportBpmInput" class="tempo-input" type="number" min="30" max="300" step="1" value="120" onchange="setProjectBpm(this.value)" title="BPM progetto"><b id="transportBpm" hidden>120</b> BPM <button type="button" class="tap-tempo-icon" onclick="tapProjectTempo()" title="Tap tempo · press repeatedly to set BPM" aria-label="Tap tempo · press repeatedly to set BPM">♩</button> &nbsp; <select id="transportTimeSignature" class="signature-input" onchange="setProjectTimeSignature(this.value,true)" title="Time signature progetto" aria-label="Time signature"><option>2/4</option><option>3/4</option><option selected>4/4</option><option>5/4</option><option>6/8</option><option>7/8</option><option>9/8</option><option>12/8</option></select> &nbsp; <input id="transportPitchInput" class="pitch-input" type="number" min="-6" max="6" step="0.1" value="0" onchange="setProjectPitch(this.value)" title="Trasposizione semitoni"> st</span></div>
    <div class="transport-seek-box" role="group" aria-label="Project position"><label for="transportSeek">Position <b id="transportSeekLabel">0%</b></label><input id="transportSeek" type="range" min="0" max="1000" step="1" value="0" oninput="seekProjectFromSlider(this.value)" title="Seek through entire project" aria-label="Seek through entire project" aria-valuetext="0%"></div>
    <div class="top-spacer"></div>
    <div class="zoom-top"><span>Zoom <b id="zoomDisplay">100%</b></span><div class="zoom-controls"><button type="button" class="zoom-step" onclick="stepZoom(-1)" title="Riduci zoom" aria-label="Riduci zoom">−</button><input id="topZoom" type="range" min="25" max="1200" value="70" onpointerdown="beginZoomPreview()" oninput="previewZoom(this.value)" onchange="commitZoom(this.value)" ondblclick="resetZoomDefault(event)" title="Zoom timeline · doppio click per ripristinare il default"><button type="button" class="zoom-step" onclick="stepZoom(1)" title="Aumenta zoom" aria-label="Aumenta zoom">+</button><select id="zoomPreset" onchange="applyZoomPreset(this.value)" title="Preset zoom timeline" aria-label="Preset zoom timeline"><option value="custom">Custom</option><optgroup label="Percentuale"><option value="pct:25">25%</option><option value="pct:50">50%</option><option value="pct:75">75%</option><option value="pct:100" selected>100%</option><option value="pct:150">150%</option><option value="pct:200">200%</option><option value="pct:400">400%</option></optgroup><optgroup label="Tempo"><option value="seconds:1">1 s</option><option value="seconds:5">5 s</option><option value="seconds:10">10 s</option><option value="fit">Fit</option></optgroup><optgroup label="Beat / misure"><option value="beats:1">1 beat</option><option value="beats:2">2 beat</option><option value="bars:1">1 misura</option><option value="bars:2">2 misure</option><option value="bars:4">4 misure</option><option value="bars:8">8 misure</option></optgroup></select></div></div>
    <div class="header-actions">
      <a class="header-link auth-managed" href="/account" title="Account" aria-label="Account"><span class="control-icon" aria-hidden="true">👤</span><span class="control-text">Account</span></a>
      <a id="adminNav" class="header-link auth-managed" href="/settings" title="Settings" aria-label="Amministrazione" hidden><span class="control-icon" aria-hidden="true">⚙</span><span class="control-text">Settings</span></a>
      <button class="primary-icon-action" onclick="newProject()" title="New project" aria-label="New project"><span class="control-icon" aria-hidden="true">⊞</span></button>
      <button class="primary-icon-action" onclick="openProjectSelector()" title="Open project" aria-label="Open project"><span class="control-icon" aria-hidden="true">📂</span></button>
      <button class="primary-icon-action" onclick="save()" title="Save" aria-label="Save"><span class="control-icon" aria-hidden="true">💾</span></button>
      <button class="primary-icon-action" onclick="saveAsProject()" title="Save as" aria-label="Save as"><span class="control-icon" aria-hidden="true">▣</span></button>
      <button class="primary-icon-action" onclick="showProjectSetup()" title="Setup" aria-label="Setup"><span class="control-icon" aria-hidden="true">⚙</span></button>
      <button id="exportPanelMenuBtn" class="accent primary-icon-action" onclick="openExportPanel()" title="Export" aria-label="Export"><span class="control-icon" aria-hidden="true">⤴</span></button>
      <a class="header-link logout auth-managed" href="/logout" title="Esci" aria-label="Esci"><span class="control-icon" aria-hidden="true">↪</span><span class="control-text">Esci</span></a>
    </div>
  </header>
  <div id="liveTimedOverlay" class="live-timed-overlay hidden"><div id="liveChordBox" class="live-chord-box hidden"></div><div id="liveLyricBox" class="live-lyric-box hidden"></div></div>

  <div class="workspace">
    <aside class="sidebar">
      <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" type="button" onclick="toggleMobileSidebar()" aria-expanded="false"><span aria-hidden="true">☰</span><span class="mobile-menu-label">Menu</span></button>
      <nav>
        <section class="sidebar-tools collapsed" id="projectToolsPanel">
          <button class="sidebar-tools-toggle" type="button" onclick="toggleProjectToolsPanel()" aria-expanded="false" aria-controls="projectToolsBody">
            <span class="sidebar-tools-title">PROJECT / FILE</span><span id="projectToolsChevron" aria-hidden="true">▸</span>
          </button>
          <div class="sidebar-tools-body" id="projectToolsBody">
            <button class="nav-item" onclick="newProject()">＋ <span>New project</span></button>
            <button class="nav-item" onclick="openExportPanel()">⇧ <span>Export</span></button>
            <button id="saveProjectManualNav" class="nav-item native-project-action" onclick="save()" hidden>💾 <span>Save project</span></button>
            <button id="saveProjectLocalNav" class="nav-item web-project-action" onclick="saveProjectLocal()">⬇ <span>Save project locally</span></button>
            <button class="nav-item" onclick="saveAsProject()">⇩ <span>Save project as…</span></button>
            <button id="openRecentProjectBtn" class="nav-item native-project-action" onclick="openRecentProjects()" hidden>◷ <span>Open recent</span></button>
            <button class="nav-item" onclick="openProjectSelector()">⬆ <span>Open project</span></button>
            <button id="openLocalProjectBtn" class="nav-item web-project-action" onclick="openLocalProject()" hidden>▣ <span>Open local project</span></button>
            <button class="nav-item" onclick="closeCurrentProject()">⊘ <span>Close project</span></button><input id="projectArchiveFile" type="file" accept=".maeprojz,.maeproj,.mta-project.zip,.zip,application/vnd.mta-audio-editor.project" hidden>
            <button class="nav-item" onclick="showProjectInfo()">ⓘ <span>Info progetto</span></button>
            <button class="nav-item" onclick="manageProjectFiles()">▣ <span>Project files</span></button>
            <button class="nav-item auth-managed" onclick="manageProjectSharing()">⌘ <span>Share project</span></button>
            <button class="nav-item danger-nav" onclick="deleteCurrentProject()">× <span>Delete project</span></button>
          </div>
        </section>
        <div class="nav-sep"></div>
        <section class="sidebar-tools collapsed" id="editingToolsPanel">
          <button class="sidebar-tools-toggle" type="button" onclick="toggleEditingToolsPanel()" aria-expanded="false" aria-controls="editingToolsBody">
            <span class="sidebar-tools-title">EDIT / IMPORT / MIX</span><span id="editingToolsChevron" aria-hidden="true">▸</span>
          </button>
          <div class="sidebar-tools-body" id="editingToolsBody">
            <label class="nav-item">⇩ <span>Import MTA</span><input id="mtafile" type="file" accept=".mta,.mta8,.mta16" hidden></label>
            <button class="nav-item import-action import-audio-action" onclick="focusImport()"><span class="nav-icon" aria-hidden="true">♫</span><span class="nav-label">Import Audio</span></button>
            <button class="nav-item import-action" onclick="openYoutubeImport()">▶ <span>Import YouTube</span></button>
            <button class="nav-item import-action" onclick="openStemWorkflow()">▥ <span>Import &amp; Separate</span></button>
          </div>
        </section>
        <div class="nav-sep"></div>
        <section class="sidebar-tools collapsed" id="viewToolsPanel">
          <button class="sidebar-tools-toggle" type="button" onclick="toggleViewToolsPanel()" aria-expanded="false" aria-controls="viewToolsBody">
            <span class="sidebar-tools-title">VIEW</span><span id="viewToolsChevron" aria-hidden="true">▸</span>
          </button>
          <div class="sidebar-tools-body" id="viewToolsBody">
            <button class="nav-item" onclick="showMetaPanel('lyrics')">▤ <span>Lyrics</span></button>
            <button class="nav-item" onclick="showMetaPanel('chords')">♬ <span>Chords</span></button>
            <button class="nav-item" onclick="showMetaPanel('markers')">⚑ <span>Markers</span></button>
            <button class="nav-item" onclick="togglePianoPanel()">♹ <span>Piano / Chord Lab</span></button>
            <button class="nav-item" onclick="focusTracks()">☷ <span>Tracks</span></button>
            <button class="nav-item" onclick="focusInspector()">◇ <span>Plugins</span></button>
            <button class="nav-item" onclick="focusMixer()">▥ <span>Mixer</span></button>
          </div>
        </section>
        <div class="nav-sep"></div>
        <button class="nav-item" id="nativeSettingsButton" onclick="showSettings()" hidden>⚙ <span>Settings</span></button>
        <button class="nav-item" onclick="showAbout()">ⓘ <span>About</span></button>
        <a class="nav-item" href="/docs/user" target="_blank">? <span>Docs &amp; Help</span></a>
      </nav>
      <div class="sidebar-brand" aria-label="MTA Audio Editor"><div class="brand-block">
      <img src="/static/logo.svg" alt="MTA Audio Editor" class="brand-logo">
      <div><div class="brand-name"><b>MTA</b> Audio Editor</div><div class="brand-meta">Multitrack DAW / MTA8 / MTA16 &nbsp;·&nbsp; v__VERSION__ &nbsp;·&nbsp; rev __REVISION__ &nbsp;·&nbsp; build __BUILD__</div></div>
    </div></div>

    </aside>

    <main class="main-area">
      <section class="editor-zone">
        <div id="emptyState" class="empty-state"><img src="/static/logo.svg" alt=""><h2>Create or import a project</h2><p>Multitrack MTA editing, MP3 stems, insert effects and master mixing.</p><button class="accent" onclick="newProject()">Create project</button></div>
        <div id="editor" class="editor-content" hidden></div>
      </section>
      <section id="mixerDock" class="mixer-dock" hidden></section>
    </main>
  </div>
</div>
<div id="toast"></div>
<div id="utilityBackdrop" class="utility-backdrop hidden">
  <div class="utility-modal" onclick="event.stopPropagation()">
    <div class="utility-head"><h3 id="utilityTitle">Project</h3><button onclick="closeUtilityModal()">×</button></div>
    <div id="utilityBody" class="utility-body"></div>
  </div>
</div>
<input id="stemFileHidden" type="file" accept=".mp3,audio/mpeg" hidden>
<script src="/static/app.js"></script>
</body>
</html>
