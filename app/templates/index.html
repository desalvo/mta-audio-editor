<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MTA Audio Editor</title>
  <link rel="icon" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="__BODY_CLASS__">
<div class="app-shell">
  <header class="topbar">
    <div class="brand-block">
      <img src="/static/logo.svg" alt="MTA Audio Editor" class="brand-logo">
      <div><div class="brand-name"><b>MTA</b> Audio Editor</div><div class="brand-meta">MTA / MTA8 / MTA16 &nbsp;·&nbsp; v__VERSION__ &nbsp;·&nbsp; build __BUILD__</div></div>
    </div>
    <div class="project-name-block"><label>Project</label><div class="project-name-field" onclick="editProjectMeta()" title="Edit project metadata"><span id="headerProjectName">No project loaded</span><span>✎</span></div></div>
    <div class="transport">
      <button class="transport-btn" onclick="stopPlayback()" title="Stop" aria-label="Stop">■</button><button class="transport-btn" onclick="seekTransport(-5000)" title="Riavvolgi 5 secondi" aria-label="Riavvolgi 5 secondi">◀◀</button><button id="playMaster" class="transport-btn play" onclick="previewMaster()" title="Play / Preview" aria-label="Play / Preview">▶</button><button class="transport-btn" onclick="seekTransport(5000)" title="Avanti 5 secondi" aria-label="Avanti 5 secondi">▶▶</button><button id="renderBtn" class="transport-btn render-mode" onclick="toggleRenderPreview()" title="Render: include filtri e master nella preview" aria-label="Render preview">Render</button><button class="transport-btn rec" title="Record" aria-label="Record">●</button>
    </div>
    <div class="timebox"><strong id="transportTime">00:00.000</strong><span><input id="transportBpmInput" class="tempo-input" type="number" min="30" max="300" step="0.1" value="120" onchange="setProjectBpm(this.value)" title="BPM progetto"><b id="transportBpm" hidden>120</b> BPM &nbsp; <input id="transportPitchInput" class="pitch-input" type="number" min="-6" max="6" step="0.1" value="0" onchange="setProjectPitch(this.value)" title="Trasposizione semitoni"> st</span></div>
    <div class="top-spacer"></div>
    <div class="zoom-top"><span>Zoom</span><input id="topZoom" type="range" min="25" max="240" value="70" oninput="setZoom(this.value)"></div>
    <div class="header-actions">
      <a class="header-link auth-managed" href="/account" title="Account" aria-label="Account"><span class="control-icon" aria-hidden="true">👤</span><span class="control-text">Account</span></a>
      <a id="adminNav" class="header-link auth-managed" href="/admin/users" title="Amministrazione" aria-label="Amministrazione" hidden><span class="control-icon" aria-hidden="true">⚙</span><span class="control-text">Admin</span></a>
      <button onclick="save()" title="Save" aria-label="Save"><span class="control-icon" aria-hidden="true">▣</span><span class="control-text">Save</span></button>
      <button class="accent" onclick="openExportPanel()" title="Export" aria-label="Export"><span class="control-icon" aria-hidden="true">⇧</span><span class="control-text">Export</span></button>
      <a class="header-link logout auth-managed" href="/logout" title="Esci" aria-label="Esci"><span class="control-icon" aria-hidden="true">↪</span><span class="control-text">Esci</span></a>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <nav>
        <button class="nav-item active">⌂ <span>Project</span></button>
        <label class="nav-item">⇩ <span>Import MTA</span><input id="mtafile" type="file" accept=".mta,.mta8,.mta16" hidden></label>
        <button class="nav-item" onclick="focusImport()">♫ <span>Import Audio</span></button>
        <button class="nav-item" onclick="openStemWorkflow()">▥ <span>Import &amp; Separate</span></button>
        <button class="nav-item">☷ <span>Tracks</span></button>
        <button class="nav-item" onclick="focusInspector()">◇ <span>Plugins</span></button>
        <button class="nav-item" onclick="focusMixer()">▥ <span>Mixer</span></button>
        <div class="nav-sep"></div>
        <button class="nav-item">▤ <span>Lyrics</span></button>
        <button class="nav-item">♬ <span>Chords</span></button>
        <button class="nav-item">⚑ <span>Markers</span></button>
        <div class="nav-sep"></div>
        <button class="nav-item" onclick="openExportPanel()">⇧ <span>Export</span></button>
        <button class="nav-item" onclick="exportProjectArchive()">⬇ <span>Save project locally</span></button>
        <label class="nav-item">⬆ <span>Import project</span><input id="projectArchiveFile" type="file" accept=".zip,.mta-project.zip" hidden></label>
        <button class="nav-item" onclick="manageProjectFiles()">▣ <span>Project files</span></button>
        <button class="nav-item auth-managed" onclick="manageProjectSharing()">⌘ <span>Share project</span></button>
        <button class="nav-item" onclick="deleteCurrentProject()">× <span>Delete project</span></button>
        <a class="nav-item" href="/docs/user" target="_blank">? <span>Docs &amp; Help</span></a>
      </nav>
      <div class="sidebar-projects"><div class="side-title">PROJECTS</div><div id="projects"></div><button class="new-project" onclick="newProject()">＋ New project</button></div>
    </aside>

    <main class="main-area">
      <section class="editor-zone">
        <div id="emptyState" class="empty-state"><img src="/static/logo.svg" alt=""><h2>Create or import a project</h2><p>Multitrack MTA editing, MP3 stems, insert effects and master mixing.</p><button class="accent" onclick="newProject()">Create project</button></div>
        <div id="editor" class="editor-content" hidden></div>
      </section>
      <section id="mixerDock" class="mixer-dock" hidden></section>
    </main>
  </div>
</div>
<div id="toast"></div>
<div id="utilityBackdrop" class="utility-backdrop hidden" onclick="if(event.target===this)closeUtilityModal()">
  <div class="utility-modal">
    <div class="utility-head"><h3 id="utilityTitle">Project</h3><button onclick="closeUtilityModal()">×</button></div>
    <div id="utilityBody" class="utility-body"></div>
  </div>
</div>
<input id="stemFileHidden" type="file" accept=".mp3,audio/mpeg" hidden>
<script src="/static/app.js"></script>
</body>
</html>
