<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrazione · MTA Audio Editor</title><link rel="icon" href="/static/logo.svg"><link rel="stylesheet" href="/static/auth.css"></head>
<body class="auth-body"><div class="auth-photo"></div><div class="auth-overlay"></div><main class="single-auth"><section class="login-card glass compact"><img src="/static/logo.svg" class="login-logo" alt=""><h1>Crea un account</h1><p class="lead">Verifica email e secondo fattore (email o Authenticator); poi attendi l’approvazione amministratore.</p>__ERROR__
<form method="post" action="/register" class="auth-form">
<label>Nome visualizzato<input name="display_name" maxlength="120" autocomplete="name"></label>
<label>Username<input name="username" minlength="3" maxlength="64" required autocomplete="username"></label>
<label>Email<input name="email" type="email" required autocomplete="email"></label>
<label>Password<input name="password" type="password" minlength="10" required autocomplete="new-password"></label>
<label>Conferma password<input name="password2" type="password" minlength="10" required autocomplete="new-password"></label>
<label>Secondo fattore obbligatorio<select name="mfa_method"><option value="email">Codice monouso via email</option><option value="totp">App Authenticator (TOTP)</option></select></label><p id="registrationAvailability" role="status"></p><button id="registerSubmit" class="primary" type="submit">Registrati</button></form>__SOCIAL_BUTTONS__<div class="auth-link-row">Hai già un account? <a href="/login">Accedi</a></div></section></main><script src="/static/account_lifecycle.js?v=r210-account-lifecycle"></script></body></html>
