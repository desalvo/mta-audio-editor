<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amministrazione · MTA Audio Editor</title><link rel="stylesheet" href="/static/auth.css"><link rel="icon" href="/static/logo.svg"></head>
<body class="settings-body"><header class="settings-top"><a href="/" class="settings-brand"><img src="/static/logo.svg"> MTA Audio Editor</a><nav><a href="/">Editor</a><a href="/account">Profilo</a><a href="/logout">Esci</a></nav></header>
<main class="admin-wrap"><div class="settings-tabs"><button class="active" data-tab="users">Utenti</button><button data-tab="smtp">SMTP / SMTPS</button></div>
<section id="usersTab" class="settings-card"><div class="card-title-row"><div><h1>Gestione utenti</h1><p>Solo gli account con email confermata possono essere attivati.</p></div><div class="admin-actions"><a class="admin-download" href="/api/admin/projects-dump">Dump completo progetti</a><button onclick="loadUsers()">Aggiorna</button></div></div><div class="table-scroll"><table class="users-table"><thead><tr><th>Utente</th><th>Email</th><th>Stato</th><th>Ruolo</th><th>TOTP</th><th>Azioni</th></tr></thead><tbody id="usersBody"></tbody></table></div></section>
<section id="smtpTab" class="settings-card" hidden><h1>Configurazione SMTP / SMTPS</h1><p>Usata per conferma email e notifiche amministrative.</p><form id="smtpForm" class="settings-form two-col"><label>Server SMTP<input name="host" required></label><label>Porta<input name="port" type="number" min="1" max="65535" required></label><label>Sicurezza<select name="security"><option value="starttls">STARTTLS</option><option value="smtps">SMTPS</option><option value="none">Nessuna</option></select></label><label>Username<input name="username"></label><label>Password<input name="password" type="password" placeholder="Lascia vuoto per mantenere quella salvata"></label><label>Email mittente<input name="from_email" type="email"></label><label>Nome mittente<input name="from_name"></label><div class="form-actions"><button type="button" onclick="testSmtp()">Verifica connessione</button><button class="primary" type="submit">Salva configurazione</button></div></form></section>
</main><script src="/static/admin.js"></script></body></html>
