version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    ignore:
      # Python 3.14 is the current production baseline. Move to 3.15 only after
      # PyTorch/Demucs and the full multi-arch production gate are validated.
      - dependency-name: python
        versions: ["3.15.*"]
