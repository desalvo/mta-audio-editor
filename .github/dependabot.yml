version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # Pydantic 2.13.x currently resolves pydantic-core 2.46.5 unreliably on
      # CPython 3.14 in GitHub-hosted runners. Stay on 2.12.5 / core 2.41.5
      # until the production gate is deterministic across all supported arches.
      - dependency-name: pydantic
        versions: ["2.13.*", "2.14.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    ignore:
      # Python 3.14 is the current production baseline. Move to 3.15 only after
      # PyTorch/Demucs and the full multi-arch production gate are validated.
      - dependency-name: python
        versions: ["3.15.*"]
