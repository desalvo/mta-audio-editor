version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # Pydantic 2.13.x currently resolves pydantic-core 2.46.5 unreliably on
      # CPython 3.14 in GitHub-hosted runners. Stay on 2.12.5 / core 2.41.5
      # until the production gate is deterministic across all supported arches.
      - dependency-name: pydantic
        versions: ["2.13.*", "2.14.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    # Python 3.14 is the current production baseline. The Docker image tag is
    # intentionally pinned in Dockerfile; review Python major/minor base-image
    # upgrades manually together with PyTorch/Demucs compatibility.

  - package-ecosystem: gradle
    directory: /mobile/android
    schedule: {interval: weekly}
    groups:
      android-dependencies:
        patterns: ["*"]
