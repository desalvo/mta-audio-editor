name: Native server offline runtime matrix
on:
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'app/**'
      - 'scripts/server_packages/**'
      - 'tests/test_server_native*208.py'
      - '.github/workflows/server-native-runtime-validation.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'app/**'
      - 'scripts/server_packages/**'
      - 'tests/test_server_native*208.py'
      - '.github/workflows/server-native-runtime-validation.yml'
permissions:
  contents: read
jobs:
  offline-wheelhouse:
    name: ${{ matrix.name }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian13, os: ubuntu-24.04, arch: amd64, image: 'python:3.13-trixie' }
          - { name: debian12-python312, os: ubuntu-24.04, arch: amd64, image: 'python:3.12-bookworm' }
          - { name: ubuntu2404-python312, os: ubuntu-24.04, arch: amd64, image: 'ubuntu:24.04' }
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Provision Ubuntu 24.04 Python 3.12 for target-runtime build
        if: matrix.name == 'ubuntu2404-python312'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip python3-venv python3-dev python3-pytest dpkg-dev ffmpeg ca-certificates
          python3 -m venv /opt/mta-ci-python
          /opt/mta-ci-python/bin/python -m pip install 'pip>=24,<27' pytest
      - name: Validate systemd service definitions
        if: matrix.name == 'ubuntu2404-python312'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y systemd
          systemd-analyze verify scripts/server_packages/mta-server.service scripts/server_packages/mta-billing-scheduler.service scripts/server_packages/mta-billing-scheduler.timer
          grep -Eq '^Delegate=cpu io$' scripts/server_packages/mta-server.service
      - name: Prepare isolated target-runtime wheels and verify offline
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.name }}' == 'ubuntu2404-python312' ]]; then
            PY=/opt/mta-ci-python/bin/python
          else
            PY=python
            $PY -m pip install 'pip>=24,<27' pytest
          fi
          $PY scripts/server_packages/prepare_runtime.py --source . --stage "$RUNNER_TEMP/server-stage" --requirements requirements.txt
          $PY scripts/server_packages/verify_offline_runtime.py "$RUNNER_TEMP/server-stage" --check-proof
          $PY -m pytest -q tests/test_server_native_packaging_208.py tests/test_server_native_runtime_prepare_208.py tests/test_server_native_payload_smoke_208.py
      - name: Build native DEB using release gate
        if: matrix.name == 'debian13' || matrix.name == 'ubuntu2404-python312'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y dpkg-dev
          if [[ '${{ matrix.name }}' == 'ubuntu2404-python312' ]]; then PY=/opt/mta-ci-python/bin/python; else PY=python; fi
          MTA_SERVER_PYTHON="${PY:-python}" MTA_SERVER_STAGE="$RUNNER_TEMP/server-stage" MTA_SERVER_VERSION='0.3.0~early.208' MTA_SERVER_OUTPUT="$RUNNER_TEMP/out" MTA_SERVER_RELEASE_READY=1 bash scripts/server_packages/build_deb.sh
          dpkg-deb --field "$RUNNER_TEMP"/out/*.deb Package | grep -qx mta-audio-editor-server
          mkdir -p "$RUNNER_TEMP/deb-root"
          dpkg-deb -x "$RUNNER_TEMP"/out/*.deb "$RUNNER_TEMP/deb-root"
          ${PY:-python} scripts/server_packages/smoke_offline_payload.py --root "$RUNNER_TEMP/deb-root"
      - name: Install and reinstall DEB in disposable CI container
        if: matrix.name == 'debian13' || matrix.name == 'ubuntu2404-python312'
        shell: bash
        run: |
          set -euo pipefail
          MTA_CI_DISPOSABLE_CONTAINER=1 MTA_SERVER_DEB="$(find "$RUNNER_TEMP/out" -maxdepth 1 -name '*.deb' -print -quit)" bash scripts/server_packages/test_deb_upgrade.sh
      - name: Publish validation artifact (not a release)
        if: matrix.name == 'debian13' || matrix.name == 'ubuntu2404-python312'
        uses: actions/upload-artifact@v4
        with:
          name: mta-server-deb-${{ matrix.name }}-unreleased-test
          path: ${{ runner.temp }}/out/*.deb
          retention-days: 2

  rpm-payload:
    name: Rocky Linux 9 RPM offline payload
    runs-on: ubuntu-24.04
    container:
      image: rockylinux:9
    steps:
      - name: Install build and Python 3.12 tools
        run: |
          set -euo pipefail
          dnf -y install git rpm rpm-build rpmdevtools cpio python3.12 python3.12-pip python3.12-devel
          command -v rpm2cpio || { echo "Rocky rpm tools must provide rpm2cpio" >&2; exit 1; }
      - uses: actions/checkout@v4
      - name: Prepare release-ready offline runtime
        run: |
          set -euo pipefail
          python3.12 -m pip install 'pip>=24,<27'
          python3.12 scripts/server_packages/prepare_runtime.py --source . --stage /tmp/mta-server-stage --requirements requirements.txt
          python3.12 scripts/server_packages/verify_offline_runtime.py /tmp/mta-server-stage --check-proof
      - name: Build RPM and test extracted payload offline
        run: |
          set -euo pipefail
          MTA_SERVER_PYTHON=python3.12 MTA_SERVER_STAGE=/tmp/mta-server-stage MTA_RPM_VERSION=0.3.0 MTA_RPM_RELEASE=0.208.early MTA_SERVER_OUTPUT=/tmp/mta-rpm-out MTA_SERVER_RELEASE_READY=1 bash scripts/server_packages/build_rpm.sh
          rpm -qp --qf '%{NAME}\n' /tmp/mta-rpm-out/*.rpm | grep -qx mta-audio-editor-server
          mkdir -p /tmp/mta-rpm-root
          cd /tmp/mta-rpm-root
          rpm2cpio /tmp/mta-rpm-out/*.rpm | cpio -idm --quiet
          cd "$GITHUB_WORKSPACE"
          python3.12 scripts/server_packages/smoke_offline_payload.py --root /tmp/mta-rpm-root
      - name: Install test dependencies from approved Rocky/EPEL sources
        run: |
          set -euo pipefail
          dnf -y install epel-release
          dnf config-manager --set-enabled crb || true
          dnf -y install ffmpeg-free
          command -v ffmpeg
      - name: Install and reinstall RPM in disposable CI container
        run: |
          set -euo pipefail
          MTA_CI_DISPOSABLE_CONTAINER=1 MTA_SERVER_RPM="$(find /tmp/mta-rpm-out -maxdepth 1 -name '*.rpm' -print -quit)" bash scripts/server_packages/test_rpm_upgrade.sh
      - name: Validate guarded RPM install test
        run: |
          set -euo pipefail
          bash -n scripts/server_packages/test_rpm_upgrade.sh
          if MTA_SERVER_RPM=/tmp/mta-rpm-out/test.rpm bash scripts/server_packages/test_rpm_upgrade.sh; then
            echo 'ERROR: destructive RPM test escaped its disposable-container guard' >&2
            exit 1
          fi
      - name: Build previous RPM revision and validate DNF version cycle
        run: |
          set -euo pipefail
          MTA_SERVER_PYTHON=python3.12 MTA_SERVER_STAGE=/tmp/mta-server-stage MTA_RPM_VERSION=0.3.0 MTA_RPM_RELEASE=0.207.early MTA_SERVER_OUTPUT=/tmp/mta-rpm-old MTA_SERVER_RELEASE_READY=1 bash scripts/server_packages/build_rpm.sh
          MTA_CI_DISPOSABLE_CONTAINER=1 MTA_SERVER_RPM_OLD="$(find /tmp/mta-rpm-old -name '*.rpm' -print -quit)" MTA_SERVER_RPM_NEW="$(find /tmp/mta-rpm-out -name '*.rpm' -print -quit)" bash scripts/server_packages/test_rpm_version_cycle.sh
      - name: Validate GPG-signed RPM and signed DNF repository (ephemeral key)
        run: |
          set -euo pipefail
          dnf -y install gnupg2 createrepo_c rpm-sign
          MTA_CI_DISPOSABLE_CONTAINER=1 MTA_SERVER_RPM="$(find /tmp/mta-rpm-out -name '*.rpm' -print -quit)" bash scripts/repositories/test_signed_rpm_repository_ci.sh
      - name: Upload unreleased RPM for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mta-server-rpm-unreleased-test
          path: /tmp/mta-rpm-out/*.rpm
          retention-days: 2

  ubuntu-systemd-vm:
    name: Ubuntu 24.04 systemd service acceptance (disposable VM)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build offline Python 3.12 server payload
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev dpkg-dev ffmpeg curl
          python3 -m venv "$RUNNER_TEMP/mta-build-python"
          "$RUNNER_TEMP/mta-build-python/bin/python" -m pip install 'pip>=24,<27'
          "$RUNNER_TEMP/mta-build-python/bin/python" scripts/server_packages/prepare_runtime.py --source . --stage "$RUNNER_TEMP/server-stage" --requirements requirements.txt
          "$RUNNER_TEMP/mta-build-python/bin/python" scripts/server_packages/verify_offline_runtime.py "$RUNNER_TEMP/server-stage" --check-proof
          MTA_SERVER_PYTHON="$RUNNER_TEMP/mta-build-python/bin/python" MTA_SERVER_STAGE="$RUNNER_TEMP/server-stage" MTA_SERVER_VERSION='0.3.0~early.208' MTA_SERVER_OUTPUT="$RUNNER_TEMP/out" MTA_SERVER_RELEASE_READY=1 bash scripts/server_packages/build_deb.sh
      - name: Install DEB and verify systemd services on ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /proc/1/comm)" = systemd
          sudo apt-get install -y "$RUNNER_TEMP"/out/*.deb
          sudo env MTA_CI_DISPOSABLE_VM=1 bash scripts/server_packages/check_system_services.sh
      - name: Reinstall and verify service recovery and persistent state
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/lib/mta/projects
          printf '%s\n' 'vm-state-preserved' | sudo tee /var/lib/mta/projects/.native-vm-ci-fixture >/dev/null
          sudo cp /etc/mta/mta.env "$RUNNER_TEMP/server-mta-before.env"
          sudo apt-get install -y --reinstall "$RUNNER_TEMP"/out/*.deb
          sudo test "$(sudo cat /var/lib/mta/projects/.native-vm-ci-fixture)" = vm-state-preserved
          sudo cmp /etc/mta/mta.env "$RUNNER_TEMP/server-mta-before.env"
          sudo env MTA_CI_DISPOSABLE_VM=1 bash scripts/server_packages/check_system_services.sh
      - name: Verify APT upgrade downgrade and re-upgrade with active systemd
        shell: bash
        run: |
          set -euo pipefail
          MTA_SERVER_PYTHON="$RUNNER_TEMP/mta-build-python/bin/python" MTA_SERVER_STAGE="$RUNNER_TEMP/server-stage" MTA_SERVER_VERSION='0.3.0~early.207' MTA_SERVER_OUTPUT="$RUNNER_TEMP/old-out" MTA_SERVER_RELEASE_READY=1 bash scripts/server_packages/build_deb.sh
          sudo env MTA_CI_DISPOSABLE_VM=1 MTA_SERVER_DEB_OLD="$(find "$RUNNER_TEMP/old-out" -name '*.deb' -print -quit)" MTA_SERVER_DEB_NEW="$(find "$RUNNER_TEMP/out" -name '*.deb' -print -quit)" RUNNER_TEMP="$RUNNER_TEMP" bash scripts/server_packages/test_deb_version_cycle.sh
