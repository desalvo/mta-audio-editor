name: CI / Production image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: mta-audio-editor-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: desalvo/mta-audio-editor
  PYTHON_VERSION: '3.14'

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - name: Compile
        run: python -m compileall -q app native scripts/k8s-wizard.py
      - name: Build documentation PDFs
        run: python scripts/build_docs.py
      - name: Install FFmpeg for DSP preset validation
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate audio presets against FFmpeg
        run: PYTHONPATH=. python scripts/validate_audio_presets.py
      - name: Ruff
        run: ruff check app native tests scripts/k8s-wizard.py
      - name: Unit tests and coverage gate
        env:
          MTA_ALLOW_INSECURE_NO_AUTH: 'true'
          MTA_DATA_DIR: /tmp/mta-projects
        run: PYTHONPATH=. pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  security:
    name: SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks needs the parent commit on pull_request events.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - name: Bandit SAST
        run: bandit -q -r app native scripts/k8s-wizard.py -lll -iii
      - name: Python dependency audit
        shell: bash
        run: |
          pip-audit -r requirements.txt --strict
          pip-audit -r requirements-native.txt --strict
          pip-audit -r requirements-lyrics.txt --strict
          # requirements-chords uses a commit-pinned direct URL because the latest PyPI
          # release predates the chord/chroma modules. Install that reviewed commit in
          # an isolated environment, then audit every PyPI-resolvable dependency from
          # the resolved freeze while excluding only the non-PyPI madmom-infer source.
          CHORDS_VENV="$RUNNER_TEMP/mta-chords-audit"
          CHORDS_AUDIT_REQ="$RUNNER_TEMP/requirements-chords-audit.txt"
          python -m venv "$CHORDS_VENV"
          "$CHORDS_VENV/bin/python" -m pip install --upgrade pip
          "$CHORDS_VENV/bin/python" -m pip install -r requirements-chords.txt
          "$CHORDS_VENV/bin/python" -m pip freeze | grep -v '^madmom-infer @' > "$CHORDS_AUDIT_REQ"
          cat "$CHORDS_AUDIT_REQ"
          pip-audit -r "$CHORDS_AUDIT_REQ" --strict
          # pip-audit/PyPI cannot identify PyTorch local-version wheels such as
          # 2.14.1+cpu. Audit the equivalent upstream public version instead.
          STEMS_AUDIT_REQ="$RUNNER_TEMP/requirements-stems-audit.txt"
          sed '/^--extra-index-url /d; s/^torch==\(.*\)+cpu$/torch==\1/' requirements-stems.txt > "$STEMS_AUDIT_REQ"
          cat "$STEMS_AUDIT_REQ"
          pip-audit -r "$STEMS_AUDIT_REQ" --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  container:
    name: Container production gate
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Generate build id
        id: build
        shell: bash
        run: echo "id=$(TZ=Europe/Rome date '+%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
      - name: Build local validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: mta-audio-editor:ci
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.2.0-112' }}
            BUILD_ID=${{ steps.build.outputs.id }}
      - name: Verify container OS
        shell: bash
        run: |
          docker run --rm --entrypoint sh mta-audio-editor:ci -ec '
            cat /etc/os-release
            . /etc/os-release
            test "$ID" = "debian"
            test "$VERSION_CODENAME" = "trixie"
            case "$VERSION_ID" in 13|13.*) ;; *) exit 1 ;; esac
          '
      - name: Verify security-sensitive Python packages in image
        shell: bash
        run: |
          docker run --rm --entrypoint python mta-audio-editor:ci -c \
            'from importlib.metadata import version; expected={"setuptools":"84.0.0","wheel":"0.48.0","urllib3":"2.8.0","msgpack":"1.2.3"}; bad=[]; [(print(f"{p}=={version(p)}") or (bad.append((p,version(p),v)) if version(p)!=v else None)) for p,v in expected.items()]; raise SystemExit(1 if bad else 0)'
      - name: Verify CPU-only PyTorch image
        shell: bash
        run: |
          docker run --rm --entrypoint python mta-audio-editor:ci -c '
          import torch
          from importlib.metadata import distributions
          assert "+cpu" in torch.__version__, torch.__version__
          n=[d.metadata.get("Name","") for d in distributions() if d.metadata.get("Name","").lower().startswith("nvidia-")]
          print("torch", torch.__version__)
          print("NVIDIA Python packages:", n)
          assert not n, n
          '
      - name: Audit installed Python environment in image
        shell: bash
        run: |
          docker run --rm --user 0 --entrypoint sh mta-audio-editor:ci -ec '
            python -m pip install --no-cache-dir --disable-pip-version-check pip-audit
            # Audit production requirements using the public torch release that
            # corresponds to the installed 2.14.1+cpu wheel.
            sed "/^--extra-index-url /d; s/^torch==\(.*\)+cpu$/torch==\1/" requirements-stems.txt > /tmp/stems-audit.txt
            python -m pip_audit -r requirements.txt -r /tmp/stems-audit.txt --strict
          '
      - name: Trivy image OS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mta-audio-editor:ci
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test
        shell: bash
        run: |
          CI_ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          docker run -d --rm --name mta-ci -p 18080:8080 \
            -e MTA_ADMIN_PASSWORD="$CI_ADMIN_PASSWORD" \
            -e MTA_ADMIN_EMAIL="ci-admin@example.invalid" \
            mta-audio-editor:ci
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/docs/user >/dev/null
          # Browser-only protected pages now redirect unauthenticated users to the login page.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/docs/admin)" = "303"
          curl -sSI http://127.0.0.1:18080/docs/admin | tr -d '\r' | grep -qi '^location: /login$'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/projects)" = "401"
          test "$(curl -s -u "admin:$CI_ADMIN_PASSWORD" -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/projects)" = "403"
          curl -fsS -u "admin:$CI_ADMIN_PASSWORD" -H 'X-MTA-Request: 1' -X POST http://127.0.0.1:18080/api/projects >/dev/null
          docker stop mta-ci


  native-windows:
    name: Native Windows installer
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install application and native build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-stems.txt
          pip install -r requirements-native.txt
          pip install -r requirements-lyrics.txt
          pip install -r requirements-chords.txt
          pip check
      - name: Install FFmpeg and Inno Setup
        shell: pwsh
        run: |
          choco install ffmpeg innosetup -y --no-progress
          $toolsRoot=Join-Path $env:ChocolateyInstall "lib"
          $ffmpeg=(Get-ChildItem $toolsRoot -Recurse -Filter ffmpeg.exe | Where-Object { $_.FullName -notlike "*\chocolatey\bin\*" } | Select-Object -First 1).FullName
          $ffprobe=(Get-ChildItem $toolsRoot -Recurse -Filter ffprobe.exe | Where-Object { $_.FullName -notlike "*\chocolatey\bin\*" } | Select-Object -First 1).FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw "Unable to locate the real FFmpeg binaries" }
          "MTA_NATIVE_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MTA_NATIVE_FFPROBE=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ffmpeg=$ffmpeg"
          Write-Host "ffprobe=$ffprobe"
      - name: Generate native build id
        shell: pwsh
        run: |
          $build=(Get-Date).ToUniversalTime().ToString("yyyyMMddHHmmss")
          Set-Content -Path BUILD_INFO -Value $build
      - name: Generate native application metadata
        shell: pwsh
        run: python native/generate_native_metadata.py
      - name: Build Windows native application
        shell: pwsh
        run: pyinstaller --noconfirm --clean native/mta_audio_editor_native.spec
      - name: Native single-user smoke test
        shell: pwsh
        run: '& ".\dist\MTA Audio Editor\MTA Audio Editor.exe" --native-smoke'
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          $version=(Get-Content VERSION -Raw).Trim()
          $iscc=(Get-Command ISCC.exe -ErrorAction SilentlyContinue)
          if (-not $iscc) {
            $candidate="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $candidate)) { throw "ISCC.exe not found" }
            $iscc=$candidate
          } else {
            $iscc=$iscc.Source
          }
          $sourceDir=(Resolve-Path ".\dist\MTA Audio Editor").Path
          $outputDir=(Resolve-Path ".\dist-installer").Path
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" "native\windows-installer.iss"
      - name: Checksum Windows installer
        shell: pwsh
        run: |
          Get-ChildItem dist-installer\*.exe | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256"
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-${{ github.ref_name }}
          path: |
            dist-installer/*.exe
            dist-installer/*.sha256
          if-no-files-found: error
          retention-days: 30

  native-macos:
    name: Native macOS installer (${{ matrix.arch }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            python: '3.12'
          - runner: macos-15
            arch: arm64
            python: '3.14'
    runs-on: ${{ matrix.runner }}
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install application and native build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            # PyTorch stopped publishing Intel macOS wheels after 2.2.x.
            # Build the Intel desktop edition with Python 3.12 + the last official
            # x86_64 torch/torchaudio wheels while keeping Demucs 4.1.
            #
            # demucs 4.1 pulls sphn, which must compile audiopus_sys on Intel macOS.
            # GitHub's current CMake 4.x rejects the dependency's legacy
            # cmake_minimum_required declaration unless this compatibility floor
            # is explicitly enabled.
            export CMAKE_POLICY_VERSION_MINIMUM=3.5
            export MACOSX_DEPLOYMENT_TARGET=10.13
            pip install -r requirements-stems-macos-x64.txt
          else
            # Apple Silicon follows the normal current PyTorch line. macOS wheels
            # do not use the Linux/Windows '+cpu' local suffix.
            sed '/^--extra-index-url /d; s/^torch==\(.*\)+cpu$/torch==\1/' requirements-stems.txt > /tmp/requirements-native-stems.txt
            pip install -r /tmp/requirements-native-stems.txt
          fi
          pip install -r requirements-native.txt
          pip install -r requirements-lyrics.txt
          pip install -r requirements-chords.txt
          pip check
      - name: Install FFmpeg
        shell: bash
        run: |
          brew install ffmpeg
          echo "MTA_NATIVE_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "MTA_NATIVE_FFPROBE=$(command -v ffprobe)" >> "$GITHUB_ENV"
      - name: Generate native build id
        shell: bash
        run: TZ=Europe/Rome date '+%Y%m%d%H%M%S' > BUILD_INFO
      - name: Generate native application metadata
        shell: bash
        run: python native/generate_native_metadata.py
      - name: Build macOS native application
        shell: bash
        run: pyinstaller --noconfirm --clean native/mta_audio_editor_native.spec
      - name: Native single-user smoke test
        shell: bash
        run: '"dist/MTA Audio Editor.app/Contents/MacOS/MTA Audio Editor" --native-smoke'
      - name: Build macOS DMG installer
        shell: bash
        run: |
          set -euxo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          rm -rf dist-installer dmg-root
          mkdir -p dist-installer dmg-root
          cp -R "dist/MTA Audio Editor.app" dmg-root/
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "MTA Audio Editor ${version}" \
            -srcfolder dmg-root \
            -ov -format UDZO \
            "dist-installer/MTA-Audio-Editor-${version}-macOS-${{ matrix.arch }}.dmg"
      - name: Checksum macOS installer
        shell: bash
        run: |
          cd dist-installer
          shasum -a 256 *.dmg > "MTA-Audio-Editor-${{ matrix.arch }}.sha256"
      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: native-macos-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            dist-installer/*.dmg
            dist-installer/*.sha256
          if-no-files-found: error
          retention-days: 30

  mobile-android:
    name: Android APK / AAB
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 37 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Bundle default Demucs ONNX model when release asset is available
        shell: bash
        env:
          MTA_DEMUCS_ONNX_BASELINE_URL: ${{ vars.MTA_DEMUCS_ONNX_BASELINE_URL || 'https://github.com/desalvo/mta-audio-editor/releases/download/demucs-models/demucs-default-4.onnx' }}
        run: |
          set -euo pipefail
          mkdir -p mobile/android/app/src/main/assets
          target=mobile/android/app/src/main/assets/demucs-default-4.onnx
          if curl --fail --location --retry 2 --connect-timeout 20 --max-time 600 "$MTA_DEMUCS_ONNX_BASELINE_URL" -o "$target"; then
            test -s "$target"
            echo "Bundled baseline ONNX model from model release."
          else
            rm -f "$target"
            echo "Baseline ONNX release asset unavailable; runtime authenticated bootstrap will be used."
          fi
      - name: Configure optional Android release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mta-android-release.keystore"
            echo "MTA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mta-android-release.keystore" >> "$GITHUB_ENV"
            echo "MTA_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MTA_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MTA_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Android release signing secrets not configured; AAB will be built unsigned."
          fi
      - name: Compile Android sources preflight
        shell: bash
        run: gradle -p mobile/android :app:compileDebugJavaWithJavac --stacktrace
      - name: Build Android debug APK and release AAB
        shell: bash
        run: |
          gradle -p mobile/android :app:assembleDebug :app:bundleRelease :app:assembleRelease --stacktrace
      - name: Package Android artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist-mobile-android
          version="$(tr -d '\r\n' < VERSION)"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist-mobile-android/MTA-Audio-Editor-${version}-Android-debug.apk"
          if [[ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist-mobile-android/MTA-Audio-Editor-${version}-Android-release.apk"
          elif [[ -f mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk ]]; then
            cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "dist-mobile-android/MTA-Audio-Editor-${version}-Android-release-unsigned.apk"
          fi
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "dist-mobile-android/MTA-Audio-Editor-${version}-Android.aab"
          cd dist-mobile-android
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-android-${{ github.ref_name }}
          path: dist-mobile-android/*
          if-no-files-found: error
          retention-days: 30

  mobile-ios:
    name: iOS / iPadOS archive
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v7
      - name: Bundle default Demucs Core ML model when release asset is available
        shell: bash
        env:
          MTA_DEMUCS_COREML_BASELINE_URL: ${{ vars.MTA_DEMUCS_COREML_BASELINE_URL || 'https://github.com/desalvo/mta-audio-editor/releases/download/demucs-models/demucs-default-4.mlmodel' }}
        run: |
          set -euo pipefail
          mkdir -p mobile/ios/MTAEditorMobile/Models
          target=mobile/ios/MTAEditorMobile/Models/demucs-default-4.mlmodel
          if curl --fail --location --retry 2 --connect-timeout 20 --max-time 600 "$MTA_DEMUCS_COREML_BASELINE_URL" -o "$target"; then
            test -s "$target"
            echo "Bundled baseline Core ML model from model release."
          else
            rm -f "$target"
            echo "Baseline Core ML release asset unavailable; runtime authenticated bootstrap will be used."
          fi
      - name: Validate Xcode project
        shell: bash
        run: xcodebuild -project mobile/ios/MTAEditorMobile.xcodeproj -scheme MTAEditorMobile -showBuildSettings >/dev/null
      - name: Compile iOS sources preflight
        shell: bash
        run: |
          xcodebuild \
            -project mobile/ios/MTAEditorMobile.xcodeproj \
            -scheme MTAEditorMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build unsigned iOS archive
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/mobile-ios
          mkdir -p build/mobile-ios dist-mobile-ios
          xcodebuild \
            -project mobile/ios/MTAEditorMobile.xcodeproj \
            -scheme MTAEditorMobile \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/mobile-ios/MTAEditorMobile.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          version="$(tr -d '\r\n' < VERSION)"
          ditto -c -k --sequesterRsrc --keepParent \
            build/mobile-ios/MTAEditorMobile.xcarchive \
            "dist-mobile-ios/MTA-Audio-Editor-${version}-iOS-unsigned.xcarchive.zip"
      - name: Build signed IPA when Apple signing secrets are configured
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$IOS_CERTIFICATE_P12_BASE64" || -z "$IOS_PROVISIONING_PROFILE_BASE64" || -z "$IOS_TEAM_ID" ]]; then
            echo "Apple signing secrets not configured; skipping signed IPA."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/mta-mobile.keychain-db"
          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$KEYCHAIN"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          rm -rf build/mobile-ios-signed build/exported-ipa
          mkdir -p build/mobile-ios-signed build/exported-ipa
          xcodebuild \
            -project mobile/ios/MTAEditorMobile.xcodeproj \
            -scheme MTAEditorMobile \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/mobile-ios-signed/MTAEditorMobile.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.desalvo.mtaaudioeditor.mobile</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/mobile-ios-signed/MTAEditorMobile.xcarchive" \
            -exportPath "$PWD/build/exported-ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          version="$(tr -d '\r\n' < VERSION)"
          IPA=$(find build/exported-ipa -maxdepth 1 -name '*.ipa' -print -quit)
          cp "$IPA" "dist-mobile-ios/MTA-Audio-Editor-${version}-iOS.ipa"
      - name: Optional upload to TestFlight on tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find dist-mobile-ios -name '*.ipa' -print -quit || true)
          if [[ -z "$IPA" || -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_PRIVATE_KEY" ]]; then
            echo "Signed IPA/App Store Connect secrets unavailable; skipping TestFlight upload."
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Checksums
        shell: bash
        run: |
          cd dist-mobile-ios
          shasum -a 256 * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-${{ github.ref_name }}
          path: dist-mobile-ios/*
          if-no-files-found: error
          retention-days: 30

  native-release:
    name: Publish desktop/mobile installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [native-windows, native-macos, mobile-android, mobile-ios]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: mobile-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MTA Audio Editor $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
  early-release:
    name: Publish rolling early-main packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [native-windows, native-macos, mobile-android, mobile-ios]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: early-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: mobile-*
          path: early-assets
          merge-multiple: true
      - name: Build early source package and manifest
        shell: bash
        run: |
          set -euxo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          git archive --format=zip --output "early-assets/MTA-Audio-Editor-${version}-source.zip" HEAD
          cat > early-assets/early-update.json <<EOF
          {"channel":"early","version":"${version}","commit_sha":"${GITHUB_SHA}","ref":"main","repository":"${GITHUB_REPOSITORY}"}
          EOF
          sha256sum early-assets/* > early-assets/SHA256SUMS-early-main
      - name: Update rolling early-main GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f early-main "$GITHUB_SHA"
          git push origin refs/tags/early-main --force
          if gh release view early-main --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit early-main --repo "$GITHUB_REPOSITORY" --title "MTA Audio Editor Early Release" --prerelease --target main
          else
            gh release create early-main --repo "$GITHUB_REPOSITORY" --title "MTA Audio Editor Early Release" --notes "Rolling packages built from main. Use the Stable channel for tagged releases." --prerelease --target main
          fi
          gh release upload early-main early-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish Docker Hub image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    needs: [quality, security, container]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Generate build id
        id: build
        shell: bash
        run: echo "id=$(TZ=Europe/Rome date '+%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
      - name: Resolve application version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"; fi
      - name: Build and push multi-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            BUILD_ID=${{ steps.build.outputs.id }}
