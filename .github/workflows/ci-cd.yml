name: CI / Production image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: mta-audio-editor-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: desalvo/mta-audio-editor
  PYTHON_VERSION: '3.14'

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - name: Compile
        run: python -m compileall -q app native scripts/k8s-wizard.py
      - name: Build documentation PDFs
        run: python scripts/build_docs.py
      - name: Install FFmpeg for DSP preset validation
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate audio presets against FFmpeg
        run: PYTHONPATH=. python scripts/validate_audio_presets.py
      - name: Ruff
        run: ruff check app native tests scripts/k8s-wizard.py
      - name: Unit tests and coverage gate
        env:
          MTA_ALLOW_INSECURE_NO_AUTH: 'true'
          MTA_DATA_DIR: /tmp/mta-projects
        run: PYTHONPATH=. pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  security:
    name: SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks needs the parent commit on pull_request events.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - name: Bandit SAST
        run: bandit -q -r app native scripts/k8s-wizard.py -lll -iii
      - name: Python dependency audit
        shell: bash
        run: |
          pip-audit -r requirements.txt --strict
          pip-audit -r requirements-native.txt --strict
          # pip-audit/PyPI cannot identify PyTorch local-version wheels such as
          # 2.14.1+cpu. Audit the equivalent upstream public version instead.
          sed '/^--extra-index-url /d; s/^torch==\(.*\)+cpu$/torch==\1/' requirements-stems.txt > /tmp/requirements-stems-audit.txt
          cat /tmp/requirements-stems-audit.txt
          pip-audit -r /tmp/requirements-stems-audit.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  container:
    name: Container production gate
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Generate build id
        id: build
        shell: bash
        run: echo "id=$(TZ=Europe/Rome date '+%Y%m%d-%H:%M:%S')" >> "$GITHUB_OUTPUT"
      - name: Build local validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: mta-audio-editor:ci
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.2.0-42' }}
            BUILD_ID=${{ steps.build.outputs.id }}
      - name: Verify container OS
        shell: bash
        run: |
          docker run --rm --entrypoint sh mta-audio-editor:ci -ec '
            cat /etc/os-release
            . /etc/os-release
            test "$ID" = "debian"
            test "$VERSION_CODENAME" = "trixie"
            case "$VERSION_ID" in 13|13.*) ;; *) exit 1 ;; esac
          '
      - name: Verify security-sensitive Python packages in image
        shell: bash
        run: |
          docker run --rm --entrypoint python mta-audio-editor:ci -c \
            'from importlib.metadata import version; expected={"setuptools":"84.0.0","wheel":"0.48.0","urllib3":"2.8.0","msgpack":"1.2.1"}; bad=[]; [(print(f"{p}=={version(p)}") or (bad.append((p,version(p),v)) if version(p)!=v else None)) for p,v in expected.items()]; raise SystemExit(1 if bad else 0)'
      - name: Verify CPU-only PyTorch image
        shell: bash
        run: |
          docker run --rm --entrypoint python mta-audio-editor:ci -c '
          import torch
          from importlib.metadata import distributions
          assert "+cpu" in torch.__version__, torch.__version__
          n=[d.metadata.get("Name","") for d in distributions() if d.metadata.get("Name","").lower().startswith("nvidia-")]
          print("torch", torch.__version__)
          print("NVIDIA Python packages:", n)
          assert not n, n
          '
      - name: Audit installed Python environment in image
        shell: bash
        run: |
          docker run --rm --user 0 --entrypoint sh mta-audio-editor:ci -ec '
            python -m pip install --no-cache-dir --disable-pip-version-check pip-audit
            # Audit production requirements using the public torch release that
            # corresponds to the installed 2.14.1+cpu wheel.
            sed "/^--extra-index-url /d; s/^torch==\(.*\)+cpu$/torch==\1/" requirements-stems.txt > /tmp/stems-audit.txt
            python -m pip_audit -r requirements.txt -r /tmp/stems-audit.txt --strict
          '
      - name: Trivy image OS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mta-audio-editor:ci
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test
        shell: bash
        run: |
          CI_ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          docker run -d --rm --name mta-ci -p 18080:8080 \
            -e MTA_ADMIN_PASSWORD="$CI_ADMIN_PASSWORD" \
            -e MTA_ADMIN_EMAIL="ci-admin@example.invalid" \
            mta-audio-editor:ci
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/docs/user >/dev/null
          # Browser-only protected pages now redirect unauthenticated users to the login page.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/docs/admin)" = "303"
          curl -sSI http://127.0.0.1:18080/docs/admin | tr -d '\r' | grep -qi '^location: /login$'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/projects)" = "401"
          test "$(curl -s -u "admin:$CI_ADMIN_PASSWORD" -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/projects)" = "403"
          curl -fsS -u "admin:$CI_ADMIN_PASSWORD" -H 'X-MTA-Request: 1' -X POST http://127.0.0.1:18080/api/projects >/dev/null
          docker stop mta-ci


  native-windows:
    name: Native Windows installer
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install application and native build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-stems.txt
          pip install -r requirements-native.txt
          pip check
      - name: Install FFmpeg and Inno Setup
        shell: pwsh
        run: |
          choco install ffmpeg innosetup -y --no-progress
          $toolsRoot=Join-Path $env:ChocolateyInstall "lib"
          $ffmpeg=(Get-ChildItem $toolsRoot -Recurse -Filter ffmpeg.exe | Where-Object { $_.FullName -notlike "*\chocolatey\bin\*" } | Select-Object -First 1).FullName
          $ffprobe=(Get-ChildItem $toolsRoot -Recurse -Filter ffprobe.exe | Where-Object { $_.FullName -notlike "*\chocolatey\bin\*" } | Select-Object -First 1).FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw "Unable to locate the real FFmpeg binaries" }
          "MTA_NATIVE_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MTA_NATIVE_FFPROBE=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ffmpeg=$ffmpeg"
          Write-Host "ffprobe=$ffprobe"
      - name: Generate native build id
        shell: pwsh
        run: |
          $build=(Get-Date).ToUniversalTime().ToString("yyyyMMdd-HH:mm:ss")
          Set-Content -Path BUILD_INFO -Value $build
      - name: Build Windows native application
        shell: pwsh
        run: pyinstaller --noconfirm --clean native/mta_audio_editor_native.spec
      - name: Native single-user smoke test
        shell: pwsh
        run: '& ".\dist\MTA Audio Editor\MTA Audio Editor.exe" --native-smoke'
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          $version=(Get-Content VERSION -Raw).Trim()
          $iscc=(Get-Command ISCC.exe -ErrorAction SilentlyContinue)
          if (-not $iscc) {
            $candidate="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $candidate)) { throw "ISCC.exe not found" }
            $iscc=$candidate
          } else {
            $iscc=$iscc.Source
          }
          $sourceDir=(Resolve-Path ".\dist\MTA Audio Editor").Path
          $outputDir=(Resolve-Path ".\dist-installer").Path
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" "native\windows-installer.iss"
      - name: Checksum Windows installer
        shell: pwsh
        run: |
          Get-ChildItem dist-installer\*.exe | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256"
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-${{ github.ref_name }}
          path: |
            dist-installer/*.exe
            dist-installer/*.sha256
          if-no-files-found: error
          retention-days: 30

  native-macos:
    name: Native macOS installer (${{ matrix.arch }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install application and native build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # macOS PyTorch wheels do not use the Linux/Windows '+cpu' local suffix.
          sed '/^--extra-index-url /d; s/^torch==\(.*\)+cpu$/torch==\1/' requirements-stems.txt > /tmp/requirements-native-stems.txt
          pip install -r /tmp/requirements-native-stems.txt
          pip install -r requirements-native.txt
          pip check
      - name: Install FFmpeg
        shell: bash
        run: |
          brew install ffmpeg
          echo "MTA_NATIVE_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          echo "MTA_NATIVE_FFPROBE=$(command -v ffprobe)" >> "$GITHUB_ENV"
      - name: Generate native build id
        shell: bash
        run: TZ=Europe/Rome date '+%Y%m%d-%H:%M:%S' > BUILD_INFO
      - name: Build macOS native application
        shell: bash
        run: pyinstaller --noconfirm --clean native/mta_audio_editor_native.spec
      - name: Native single-user smoke test
        shell: bash
        run: '"dist/MTA Audio Editor.app/Contents/MacOS/MTA Audio Editor" --native-smoke'
      - name: Build macOS DMG installer
        shell: bash
        run: |
          set -euxo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          rm -rf dist-installer dmg-root
          mkdir -p dist-installer dmg-root
          cp -R "dist/MTA Audio Editor.app" dmg-root/
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "MTA Audio Editor ${version}" \
            -srcfolder dmg-root \
            -ov -format UDZO \
            "dist-installer/MTA-Audio-Editor-${version}-macOS-${{ matrix.arch }}.dmg"
      - name: Checksum macOS installer
        shell: bash
        run: |
          cd dist-installer
          shasum -a 256 *.dmg > "MTA-Audio-Editor-${{ matrix.arch }}.sha256"
      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: native-macos-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            dist-installer/*.dmg
            dist-installer/*.sha256
          if-no-files-found: error
          retention-days: 30

  native-release:
    name: Publish native installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [native-windows, native-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MTA Audio Editor $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
  publish:
    name: Publish Docker Hub image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    needs: [quality, security, container]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Generate build id
        id: build
        shell: bash
        run: echo "id=$(TZ=Europe/Rome date '+%Y%m%d-%H:%M:%S')" >> "$GITHUB_OUTPUT"
      - name: Resolve application version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"; fi
      - name: Build and push multi-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            BUILD_ID=${{ steps.build.outputs.id }}
