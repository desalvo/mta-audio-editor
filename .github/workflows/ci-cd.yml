name: CI / Production image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: mta-audio-editor-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: desalvo/mta-audio-editor
  PYTHON_VERSION: '3.14'

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - name: Compile
        run: python -m compileall -q app scripts/k8s-wizard.py
      - name: Build documentation PDFs
        run: python scripts/build_docs.py
      - name: Install FFmpeg for DSP preset validation
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate audio presets against FFmpeg
        run: PYTHONPATH=. python scripts/validate_audio_presets.py
      - name: Ruff
        run: ruff check app tests scripts/k8s-wizard.py
      - name: Unit tests and coverage gate
        env:
          MTA_ALLOW_INSECURE_NO_AUTH: 'true'
          MTA_DATA_DIR: /tmp/mta-projects
        run: PYTHONPATH=. pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  security:
    name: SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks needs the parent commit on pull_request events.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - name: Bandit SAST
        run: bandit -q -r app scripts/k8s-wizard.py -lll -iii
      - name: Python dependency audit
        run: pip-audit -r requirements.txt -r requirements-stems.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  container:
    name: Container production gate
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Generate build id
        id: build
        shell: bash
        run: echo "id=$(TZ=Europe/Rome date '+%Y%m%d-%H:%M:%S')" >> "$GITHUB_OUTPUT"
      - name: Build local validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: mta-audio-editor:ci
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.2.0-18' }}
            BUILD_ID=${{ steps.build.outputs.id }}
      - name: Verify container OS
        shell: bash
        run: |
          docker run --rm --entrypoint sh mta-audio-editor:ci -ec '
            cat /etc/os-release
            . /etc/os-release
            test "$ID" = "debian"
            test "$VERSION_CODENAME" = "trixie"
            case "$VERSION_ID" in 13|13.*) ;; *) exit 1 ;; esac
          '
      - name: Verify security-sensitive Python packages in image
        shell: bash
        run: |
          docker run --rm --entrypoint python mta-audio-editor:ci -c \
            'from importlib.metadata import version; expected={"setuptools":"84.0.0","wheel":"0.48.0","urllib3":"2.8.0","msgpack":"1.2.1"}; bad=[]; [(print(f"{p}=={version(p)}") or (bad.append((p,version(p),v)) if version(p)!=v else None)) for p,v in expected.items()]; raise SystemExit(1 if bad else 0)'
      - name: Audit installed Python environment in image
        shell: bash
        run: |
          docker run --rm --user 0 --entrypoint sh mta-audio-editor:ci -ec '
            python -m pip install --no-cache-dir --disable-pip-version-check pip-audit
            python -m pip_audit --strict
          '
      - name: Trivy image OS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mta-audio-editor:ci
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test
        shell: bash
        run: |
          CI_ADMIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          docker run -d --rm --name mta-ci -p 18080:8080 \
            -e MTA_ADMIN_PASSWORD="$CI_ADMIN_PASSWORD" \
            mta-audio-editor:ci
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:18080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:18080/docs/user >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/docs/admin)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/projects)" = "401"
          test "$(curl -s -u "admin:$CI_ADMIN_PASSWORD" -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/projects)" = "403"
          curl -fsS -u "admin:$CI_ADMIN_PASSWORD" -H 'X-MTA-Request: 1' -X POST http://127.0.0.1:18080/api/projects >/dev/null
          docker stop mta-ci

  publish:
    name: Publish Docker Hub image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    needs: [quality, security, container]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Generate build id
        id: build
        shell: bash
        run: echo "id=$(TZ=Europe/Rome date '+%Y%m%d-%H:%M:%S')" >> "$GITHUB_OUTPUT"
      - name: Resolve application version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; else echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"; fi
      - name: Build and push multi-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            BUILD_ID=${{ steps.build.outputs.id }}
