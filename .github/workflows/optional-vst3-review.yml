name: Review optional VST3 catalog licenses
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python scripts/review_optional_vst3.py
