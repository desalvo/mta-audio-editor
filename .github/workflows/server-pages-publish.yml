name: Publish signed server packages to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Successful Native server offline runtime matrix run ID from main
        required: true
        type: string
      channel:
        description: Signed repository channel
        required: true
        type: choice
        options: [early, stable]
permissions:
  contents: read
  actions: read
concurrency:
  group: mta-server-pages-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: server-${{ inputs.channel }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source run is successful and belongs to current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          set -euo pipefail
          [[ $RUN_ID =~ ^[0-9]+$ ]] || exit 2
          info=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID")
          [[ $(jq -r '.name' <<<"$info") == 'Native server offline runtime matrix' ]] || exit 3
          [[ $(jq -r '.conclusion' <<<"$info") == success ]] || { echo 'Source runtime CI is not successful' >&2; exit 3; }
          source_event=$(jq -r '.event' <<<"$info")
          [[ "$source_event" == push || "$source_event" == workflow_dispatch ]] || { echo "Unsupported runtime matrix trigger: $source_event" >&2; exit 3; }
          [[ $(jq -r '.head_branch' <<<"$info") == main ]] || { echo 'Source runtime matrix must run on main' >&2; exit 3; }
          [[ $(jq -r '.head_sha' <<<"$info") == "$GITHUB_SHA" ]] || { echo 'Source CI does not match publishing commit' >&2; exit 3; }
      - name: Install signing and repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm rpm2cpio gnupg dpkg-dev apt-utils createrepo-c git jq rsync python3-rpm
      - name: Download vetted native packages
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.verified_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/incoming"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n mta-server-deb-debian13-unreleased-test -D "$RUNNER_TEMP/incoming"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n mta-server-rpm-unreleased-test -D "$RUNNER_TEMP/incoming"
          test "$(find "$RUNNER_TEMP/incoming" -maxdepth 1 -name '*.deb' | wc -l)" -ge 1
          test "$(find "$RUNNER_TEMP/incoming" -maxdepth 1 -name '*.rpm' | wc -l)" -ge 1
      - name: Restore previous channel and retain two versions
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          # Public manifests carry no secrets. Only download a previously signed snapshot
          # after confirming its originating workflow and immutable SHA-256 digest.
          mkdir -p "$RUNNER_TEMP/prior"
          git clone --depth 1 https://github.com/desalvo/mta-audio-editor-packages.git "$RUNNER_TEMP/prior/pages"
          manifest="$RUNNER_TEMP/prior/pages/manifests/$CHANNEL.json"
          if [[ -f "$manifest" ]]; then
            run_id=$(jq -r '.run_id' "$manifest")
            [[ $run_id =~ ^[0-9]+$ ]] || exit 3
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" \
              -n "signed-mta-pages-$CHANNEL" -D "$RUNNER_TEMP/prior"
            python3 scripts/repositories/restore_previous_channel.py \
              --manifest "$manifest" --archive "$RUNNER_TEMP/prior/signed-channel.tar.gz" \
              --incoming "$RUNNER_TEMP/incoming" --channel "$CHANNEL"
          fi
          /usr/bin/python3 scripts/repositories/retain_channel_packages.py "$RUNNER_TEMP/incoming" --limit 2
          test "$(find "$RUNNER_TEMP/incoming" -maxdepth 1 -name '*.deb' | wc -l)" -ge 1
          test "$(find "$RUNNER_TEMP/incoming" -maxdepth 1 -name '*.rpm' | wc -l)" -ge 1
      - name: Import approved private key into ephemeral isolated keyring
        env:
          PRIVATE_KEY: ${{ secrets.MTA_GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.MTA_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$PRIVATE_KEY" && -n "$PASSPHRASE" ]] || exit 2
          mkdir -p "$RUNNER_TEMP/gnupg"
          chmod 700 "$RUNNER_TEMP/gnupg"
          printf '%s\n' "$PRIVATE_KEY" | GNUPGHOME="$RUNNER_TEMP/gnupg" gpg --batch --import
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
          actual=$(GNUPGHOME="$RUNNER_TEMP/gnupg" gpg --list-secret-keys --with-colons | awk -F: '$1=="fpr" {print toupper($10); exit}')
          test "$actual" = '0833A4FCB008ECAC9F98840B4C1D2DD95F5AEDB7'
      - name: Sign packages and build release indexes
        env:
          MTA_GPG_KEY_ID: 0833A4FCB008ECAC9F98840B4C1D2DD95F5AEDB7
          MTA_REPO_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          export MTA_GPG_PASSPHRASE_FILE="$RUNNER_TEMP/gpg-passphrase"
          export MTA_REPO_INPUT="$RUNNER_TEMP/incoming" MTA_REPO_OUTPUT="$RUNNER_TEMP/staging"
          bash scripts/repositories/prepare_signed_pages_release.sh
      - name: Install restricted deploy SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.MTA_PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/mta-pages"
          chmod 600 "$HOME/.ssh/mta-pages"
          ssh-keyscan -t ed25519 github.com > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}')" = 'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPZ7Mtd8Yg7cU6c'
          printf 'Host github.com\n  IdentityFile %s/.ssh/mta-pages\n  IdentitiesOnly yes\n' "$HOME" > "$HOME/.ssh/config"
      - name: Create signed-channel archive (binary payload stays outside Git)
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site-bundle/apt/$CHANNEL" "$RUNNER_TEMP/site-bundle/rpm/$CHANNEL"
          cp -a "$RUNNER_TEMP/staging/apt/$CHANNEL/." "$RUNNER_TEMP/site-bundle/apt/$CHANNEL/"
          cp -a "$RUNNER_TEMP/staging/rpm/$CHANNEL/." "$RUNNER_TEMP/site-bundle/rpm/$CHANNEL/"
          cp "$RUNNER_TEMP/staging/mta-archive-key.asc" "$RUNNER_TEMP/site-bundle/mta-archive-key.asc"
          touch "$RUNNER_TEMP/site-bundle/.nojekyll"
          tar -C "$RUNNER_TEMP/site-bundle" -czf "$RUNNER_TEMP/signed-channel.tar.gz" .
          sha256sum "$RUNNER_TEMP/signed-channel.tar.gz" | cut -d' ' -f1 > "$RUNNER_TEMP/signed-channel.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-mta-pages-${{ inputs.channel }}
          path: ${{ runner.temp }}/signed-channel.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish verified channel manifest (not package binaries)
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          git clone --depth 1 git@github.com:desalvo/mta-audio-editor-packages.git "$RUNNER_TEMP/pages"
          cd "$RUNNER_TEMP/pages"
          mkdir -p manifests
          python3 - "$CHANNEL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RUNNER_TEMP/signed-channel.sha256" <<'PYMANIFEST'
          import json, pathlib, sys
          channel, repo, run_id, commit, checksum = sys.argv[1:]
          data = {'schema': 1, 'channel': channel, 'repository': repo,
                  'run_id': int(run_id), 'commit': commit,
                  'sha256': pathlib.Path(checksum).read_text().strip()}
          pathlib.Path('manifests', channel + '.json').write_text(
              json.dumps(data, sort_keys=True, indent=2) + '\n')
          PYMANIFEST
          touch .nojekyll
          git config user.name mta-release-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Update signed MTA server $CHANNEL deployment manifest from ${GITHUB_SHA:0:12}"
            git push
          fi
      - name: Destroy temporary signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/gnupg" "$RUNNER_TEMP/gpg-passphrase" "$HOME/.ssh/mta-pages" || true
