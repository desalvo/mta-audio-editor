name: ACE-Step pinned GPU runtime image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ace_step_version.json
      - scripts/resolve_ace_step_version.py
      - scripts/vendor_ace_step.sh
      - scripts/verify_ace_step_bundle.py
      - .github/workflows/ace-step-runtime.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: ace-step-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gpu-runtime:
    name: Build pinned ACE-Step CUDA server (no model weights)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout MTA
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve audited stable version
        id: pinned
        shell: bash
        run: |
          sha="$(python scripts/resolve_ace_step_version.py)"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 2
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"
      - name: Retrieve and audit exact upstream commit
        env:
          ACE_SHA: ${{ steps.pinned.outputs.sha }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync
          bash scripts/vendor_ace_step.sh "$ACE_SHA"
          python scripts/verify_ace_step_bundle.py third_party/ace-step-1.5
          test -f third_party/ace-step-1.5/Dockerfile
          test -f third_party/ace-step-1.5/uv.lock
          test "$(cat third_party/ace-step-1.5/UPSTREAM_COMMIT)" = "$ACE_SHA"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish pinned runtime (CUDA x86_64)
        shell: bash
        env:
          ACE_SHORT: ${{ steps.pinned.outputs.short }}
        run: |
          set -euo pipefail
          # A pinned upstream Dockerfile uses the external deadsnakes PPA,
          # which can return transient 503 errors. Never mutate the upstream
          # Dockerfile or disable installation checks to get a green build.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mta-ace-step:$ACE_SHORT"
          for attempt in 1 2 3; do
            if docker buildx build --platform linux/amd64 \
              --file third_party/ace-step-1.5/Dockerfile \
              --tag "$image" --label "org.opencontainers.image.source=https://github.com/ace-step/ACE-Step-1.5" \
              --label "org.opencontainers.image.revision=${{ steps.pinned.outputs.sha }}" \
              --label 'org.opencontainers.image.licenses=MIT' \
              --provenance=mode=max --sbom=true --push \
              third_party/ace-step-1.5; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Pinned ACE-Step build failed after 3 attempts' >&2
              exit 1
            fi
            echo "Build attempt $attempt failed; retrying pinned source after cooldown" >&2
            sleep $((attempt * 30))
          done
      - name: Summarize immutable upstream reference
        env:
          ACE_SHA: ${{ steps.pinned.outputs.sha }}
          ACE_SHORT: ${{ steps.pinned.outputs.short }}
        run: |
          echo "ACE-Step source commit: $ACE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Container: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mta-ace-step:$ACE_SHORT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Checkpoint weights intentionally excluded. GPU and end-to-end inference require a separate deployment test.' >> "$GITHUB_STEP_SUMMARY"
