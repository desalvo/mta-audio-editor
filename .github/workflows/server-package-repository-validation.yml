name: Server package repository tooling
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repositories/**'
      - 'docs/PACKAGE_REPOSITORIES.md'
      - '.github/workflows/server-package-repository-validation.yml'
  pull_request:
    paths:
      - 'scripts/repositories/**'
      - 'docs/PACKAGE_REPOSITORIES.md'
      - '.github/workflows/server-package-repository-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax and safeguard missing publisher credentials
        run: |
          bash -n scripts/repositories/build_indexes.sh scripts/repositories/install_repository.sh
          if MTA_REPO_INPUT=/tmp MTA_REPO_OUTPUT=/tmp/site MTA_REPO_CHANNEL=early bash scripts/repositories/build_indexes.sh; then
            echo 'ERROR: staging accepted unsigned release without explicit GPG key' >&2
            exit 1
          fi
          if MTA_PACKAGES_URL=http://example.org MTA_REPO_KEY_FINGERPRINT=0000000000000000000000000000000000000000 bash scripts/repositories/install_repository.sh early; then
            echo 'ERROR: bootstrap accepted non-HTTPS repository' >&2
            exit 1
          fi
      - name: Validate package identity gate
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm gnupg
          tmp=$(mktemp -d)
          mkdir -p "$tmp/bad/DEBIAN" "$tmp/out" "$tmp/incoming"
          printf 'Package: mta-audio-editor\nVersion: 0.3.0-1\nArchitecture: all\nMaintainer: Tests <test@example.org>\nDescription: Desktop package; should be rejected\n' > "$tmp/bad/DEBIAN/control"
          dpkg-deb --build "$tmp/bad" "$tmp/incoming/mta-audio-editor.deb"
          # A desktop package must never become the server repository.
          if MTA_REPO_INPUT="$tmp/incoming" MTA_REPO_OUTPUT="$tmp/out" MTA_REPO_CHANNEL=early MTA_GPG_KEY_ID=0000000000000000000000000000000000000000 scripts/repositories/build_indexes.sh; then
            echo 'ERROR: desktop package published as server package' >&2
            exit 1
          fi
      - name: Set up Python and packaging test dependencies
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install packaging test dependencies
        run: python -m pip install 'pytest>=9,<10'
      - name: Validate native server package staging and packaging tools
        run: |
          python -m pytest -q tests/test_server_native_packaging_208.py
          python3 -m py_compile scripts/server_packages/validate_stage.py scripts/server_packages/wheelhouse_lock.py scripts/server_packages/verify_offline_runtime.py
          bash -n scripts/server_packages/build_deb.sh scripts/server_packages/build_rpm.sh scripts/server_packages/postinst scripts/server_packages/prerm
      - name: Smoke-build offline server Debian package (fixture only)
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/stage/application/app" "$tmp/stage/wheelhouse" "$tmp/out"
          touch "$tmp/stage/application/app/main.py" "$tmp/stage/application/app/ai_cgroup_launcher.py"
          printf 'demo==0.1\n' > "$tmp/stage/application/requirements.txt"
          python3 - "$tmp/stage/wheelhouse/demo-0.1-py3-none-any.whl" <<'PYWHEEL'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], 'w') as wheel:
              wheel.writestr('demo-0.1.dist-info/WHEEL', 'Wheel-Version: 1.0\n')
          PYWHEEL
          python3 scripts/server_packages/wheelhouse_lock.py create "$tmp/stage"
          MTA_SERVER_STAGE="$tmp/stage" MTA_SERVER_VERSION='0.3.0~early.208' MTA_SERVER_OUTPUT="$tmp/out" bash scripts/server_packages/build_deb.sh
          dpkg-deb -f "$tmp/out"/*.deb Package | grep -qx mta-audio-editor-server
          dpkg-deb -f "$tmp/out"/*.deb Version | grep -qx '0.3.0~early.208'
          dpkg-deb --contents "$tmp/out"/*.deb | grep -q 'usr/lib/mta-audio-editor-server/app/main.py'
          if MTA_SERVER_RELEASE_READY=1 MTA_SERVER_STAGE="$tmp/stage" MTA_SERVER_VERSION='0.3.0~early.208' MTA_SERVER_OUTPUT="$tmp/out" bash scripts/server_packages/build_deb.sh; then
            echo 'ERROR: CI fixture incorrectly passed release-ready gate' >&2
            exit 1
          fi
          echo 'Fixture validated. This is NOT a distributable server build.'
