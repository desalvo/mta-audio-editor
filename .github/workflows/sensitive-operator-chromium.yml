name: Optional sensitive operator Chromium
on:
  workflow_dispatch:
    inputs:
      sensitive_operator_chromium:
        description: Run all59 actual sensitive operator settings and financial review cases
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  sensitive-operator-chromium:
    if: ${{ inputs.sensitive_operator_chromium }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MTA_TEST_OFFLINE: '1'
      PYTHONPATH: .
      MTA_ALLOW_INSECURE_NO_AUTH: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.51.0
          python -m pip check
      - name: Install actual Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium
      - name: Install pinned test-only accessibility auditor
        env:
          MTA_TEST_AXE_CORE: ${{ runner.temp }}/axe.min.js
        run: |
          python - <<'PYAXE'
          import base64, hashlib, io, json, os, pathlib, tarfile, urllib.request
          metadata = json.load(urllib.request.urlopen('https://registry.npmjs.org/axe-core/4.14.0', timeout=30))
          raw = urllib.request.urlopen(metadata['dist']['tarball'], timeout=30).read()
          assert metadata['dist']['integrity'] == 'sha512-' + base64.b64encode(hashlib.sha512(raw).digest()).decode()
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as package:
              pathlib.Path(os.environ['MTA_TEST_AXE_CORE']).write_bytes(package.extractfile('package/axe.min.js').read())
          PYAXE
      - name: Run complete sensitive settings acceptance (zero skips)
        env:
          MTA_TEST_AXE_CORE: ${{ runner.temp }}/axe.min.js
          MTA_DATA_DIR: ${{ runner.temp }}/mta-sensitive-operator-data
          MTA_AI_JOB_STATE_DIR: ${{ runner.temp }}/mta-sensitive-operator-jobs
        run: python scripts/run_admin_cutover_chromium.py --operator-workflow --output sensitive-operator-ci
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sensitive-operator-chromium-${{ github.run_id }}
          if-no-files-found: warn
          path: sensitive-operator-ci/
